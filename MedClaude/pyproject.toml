[tool.poetry]
name = "medcore-diagnostic-ai"
version = "1.0.0"
description = "Clinical-grade AI diagnostic assistant"
authors = ["MedCore Team"]
python = "^3.11"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
anthropic = "^0.28.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
structlog = "^24.1.0"
qdrant-client = "^1.9.0"
redis = "^5.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
mypy = "^1.10.0"
ruff = "^0.4.0"

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
