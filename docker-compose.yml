version: '3.8'

name: medcore

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: medcore-postgres
    environment:
      POSTGRES_USER: medcore
      POSTGRES_PASSWORD: medcore_secret
      POSTGRES_DB: medcore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medcore"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: medcore-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # NestJS Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medcore-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://medcore:medcore_secret@postgres:5432/medcore
      - JWT_SECRET=medcore_jwt_secret_key_change_in_production
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: medcore-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:3001
      - VITE_WS_URL=ws://localhost:3001
    depends_on:
      - api
    restart: unless-stopped

  # Optional: Ollama for local AI (uncomment to enable)
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: medcore-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   environment:
  #     - OLLAMA_HOST=0.0.0.0:11434
  #   restart: unless-stopped

  # Optional: PgAdmin for database management (uncomment to enable)
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: medcore-pgadmin
  #   environment:
  #     - PGADMIN_DEFAULT_EMAIL: admin@medcore.com
  #     - PGADMIN_DEFAULT_PASSWORD: admin123
  #   ports:
  #     - "5050:80"
  #   volumes:
  #     - pgadmin_data:/var/lib/pgadmin
  #   depends_on:
  #     - postgres
  #   restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  # ollama_data:
  # pgadmin_data:

networks:
  default:
    name: medcore-network
